name: Sync Upstream Douer

# 检测上游 douer；有更新则自动拉取 vendor、推送到 master，并重建部署 dist。
# 注意：用 GITHUB_TOKEN 推 master 不会触发 deploy.yml（防循环），
# 因此本 workflow 内必须自行 build + force-push dist。
#
# 上游删库 / 拉不到：check 软失败（reachable=false），保留本仓库 vendor，
# 日常构建与手机 dist 不受影响；仅跳过本次更新。

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nodejs/package-lock.json

      - name: Compare vendor md5 with upstream
        id: check
        working-directory: nodejs
        run: node scripts/check-upstream.mjs

      - name: Skip when upstream unreachable
        if: steps.check.outputs.reachable == 'false'
        run: |
          echo "Upstream Darklessing/catvod unreachable — keeping pinned vendor ${{ steps.check.outputs.local }}"
          echo "Phone/dist continue to use this repo snapshot; no update this run."

      - name: Refresh vendor when changed
        if: steps.check.outputs.changed == 'true'
        working-directory: nodejs
        env:
          EXPECTED_MD5: ${{ steps.check.outputs.remote }}
        run: npm run vendor:refresh

      - name: Commit and push vendor update
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nodejs/vendor/douer/index.js nodejs/vendor/douer/index.js.md5
          if git diff --cached --quiet; then
            echo "no file changes after refresh"
            exit 0
          fi
          REMOTE="${{ steps.check.outputs.remote }}"
          git commit -m "chore: sync upstream douer ${REMOTE}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Install and build
        if: steps.check.outputs.changed == 'true'
        working-directory: nodejs
        run: |
          npm ci
          npm run build

      - name: Deploy to dist branch
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir -p deploy/nodejs
          cp -r nodejs/dist deploy/nodejs/
          cd deploy
          git init
          git checkout -b dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "deploy: sync upstream $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist

      - name: Deploy to Gitee (CN)
        if: steps.check.outputs.changed == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          if [ -z "${GITEE_TOKEN}" ] || [ -z "${GITEE_OWNER}" ]; then
            echo "GITEE_TOKEN / GITEE_OWNER not set — skip Gitee CN mirror"
            exit 0
          fi
          chmod +x scripts/deploy-gitee.sh
          ./scripts/deploy-gitee.sh deploy
