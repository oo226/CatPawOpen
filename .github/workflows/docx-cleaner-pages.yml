name: Deploy Docx Cleaner Web

on:
  push:
    branches: [master, gh-pages]
    paths:
      - "docx-cleaner/web/**"
      - ".github/workflows/docx-cleaner-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docx-cleaner-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docx-cleaner/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
